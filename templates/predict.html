<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicted Modal Price</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=2) }}">
</head>
<body class="page-result">
    <main class="result-layout">
        <a href="/" class="back-link">Back to home</a>
        <section class="result-panel" aria-labelledby="result-title">
            <p class="eyebrow">Your market estimate</p>
            <h1 id="result-title">Predicted modal price</h1>
            <p class="price-value">Rs. {{ "%.2f"|format(predicted_price|float) }}</p>
            <p class="price-unit">per quintal</p>

            <div class="details-heading">
                <h2>Prediction details</h2>
                <span>Based on your inputs</span>
            </div>
            <dl class="details-grid">
                {% for label, value in prediction_details %}
                <div class="detail-item">
                    <dt>{{ label }}</dt>
                    <dd>{{ value }}</dd>
                </div>
                {% endfor %}
            </dl>
            <a href="/index" class="primary-link">Make another prediction</a>
        </section>
    </main>
</body>
</html>
